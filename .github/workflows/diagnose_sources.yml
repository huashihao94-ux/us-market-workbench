name: Diagnose public stock data source reachability
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose_sources.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe providers with AAPL only
        run: |
          python -m pip install "requests>=2.31,<3"
          python - <<'PY'
          import requests
          endpoints={
            'sec_facts':'https://data.sec.gov/api/xbrl/companyfacts/CIK0000320193.json',
            'sec_directory':'https://www.sec.gov/files/company_tickers_exchange.json',
            'yahoo_direct':'https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=5d&interval=1d',
            'stooq':'https://stooq.com/q/d/l/?s=aapl.us&i=d&d1=20261101',
            'nasdaq':'https://api.nasdaq.com/api/quote/AAPL/historical?assetclass=stocks&limit=10',
            'corsdev_proxy':'https://proxy.cors.dev/https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=5d%26interval=1d',
          }
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36',
                   'Accept':'application/json,text/csv,*/*',
                   'Referer':'https://www.nasdaq.com/',
                   'Origin':'https://www.nasdaq.com'}
          for name,url in endpoints.items():
            try:
              r=requests.get(url,headers=headers,timeout=15)
              print(name, 'status=',r.status_code,'length=',len(r.content),'type=',r.headers.get('Content-Type'),'sample=',r.text[:90].replace('\\n',' '),flush=True)
            except Exception as e:
              print(name,'ERROR',type(e).__name__,str(e)[:140],flush=True)
          PY
