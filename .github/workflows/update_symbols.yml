name: Update stock name directory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_symbols.py'
      - '.github/workflows/update_symbols.yml'
  schedule:
    - cron: '24 1 * * 1'
permissions:
  contents: write
concurrency:
  group: us-stock-symbols
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install "requests>=2.31,<3"
      - name: Download official SEC ticker mapping
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'IndividualStockResearch/1.0 (https://github.com/huashihao94-ux/us-market-workbench)' }}
        run: python scripts/update_symbols.py
      - name: Commit code/name directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add symbols.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh stock symbol directory"
            git push
          fi
