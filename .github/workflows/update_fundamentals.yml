name: Refresh US stock prices and SEC annual metrics

on:
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: Full SEC filings + prices or prices only
        type: choice
        default: full
        options:
          - full
          - prices
  push:
    branches: [main]
    paths:
      - 'scripts/update_fundamentals.py'
      - 'scripts/update_symbols.py'
      - 'tracked_symbols.json'
      - '.github/workflows/update_fundamentals.yml'
  schedule:
    - cron: '35 1,3 * * 2-6' # 美股收盘后于北京时间09:35、11:35补抓日线报价
    - cron: '25 5 * * 0,2-6' # SEC财报每日更新（美国交易日次日及周日补偿）

permissions:
  contents: write

concurrency:
  group: us-fundamentals-update
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install "requests>=2.31,<3"
      - name: Check updater Python syntax
        run: python -m py_compile scripts/update_symbols.py scripts/update_fundamentals.py
      - name: Determine refresh mode
        id: mode
        env:
          DISPATCH_MODE: ${{ inputs.refresh_mode }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          MODE=full
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "35 1,3 * * 2-6" ]; then MODE=prices; fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DISPATCH_MODE" = "prices" ]; then MODE=prices; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Refresh official SEC listed-company names and CIKs
        if: steps.mode.outputs.mode == 'full'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if ! python scripts/update_symbols.py; then
            echo "::warning::SEC directory unavailable. Existing symbols.json retained."
          fi
      - name: Fetch latest available price close and annual financial facts
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/update_fundamentals.py --mode "${{ steps.mode.outputs.mode }}"
      - name: Commit cache and name directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fundamentals.json symbols.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh stock price and SEC filings cache"
            # Source edits may have landed while data was fetched. Rebase
            # generated files onto the latest main instead of losing results.
            for n in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "Data successfully pushed to main"
                exit 0
              fi
              git rebase --abort || true
              sleep 2
            done
            echo "::error::Failed to push generated data after retries."
            exit 1
          fi
