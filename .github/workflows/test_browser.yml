name: Browser smoke test - all market pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workbench.html'
      - 'stock_pool_v3.js'
      - 'index.html'
      - 'a-share.html'
      - 'refresh_center.js'
      - 'a_share_f10.js'
      - 'scripts/smoke_browser.py'
      - 'scripts/test_stock_models.js'
      - '.github/workflows/test_browser.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate growth and Burry valuation logic
        run: node scripts/test_stock_models.js
      - name: Install Playwright and browser
        run: |
          python -m pip install "playwright>=1.51,<2"
          python -m playwright install --with-deps chromium
      - name: Serve checked-out site
        run: |
          nohup python -m http.server 8765 --bind 127.0.0.1 > /tmp/stockpool-http.log 2>&1 &
          sleep 2
      - name: Search, add, analyze stocks and refresh all three datasets
        run: python scripts/smoke_browser.py
