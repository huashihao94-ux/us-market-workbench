name: Update A-share searchable names and prices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_a_share.py'
      - '.github/workflows/update_a_share.yml'
  schedule:
    - cron: '25 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: a-share-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP client
        run: python -m pip install "requests>=2.31,<3"
      - name: Check updater syntax
        run: python -m py_compile scripts/update_a_share.py
      - name: Refresh stock names and latest known prices
        run: python scripts/update_a_share.py
      - name: Publish cached data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add a_share_data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh A-share quote name index"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi
