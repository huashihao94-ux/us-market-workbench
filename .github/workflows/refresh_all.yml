name: One-click refresh all three markets
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manual-all-market-data
  cancel-in-progress: false
jobs:
  refresh-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data fetch dependency
        run: python -m pip install "requests>=2.31,<3"
      - name: Validate all data updaters
        run: python -m py_compile scripts/update_data.py scripts/update_symbols.py scripts/update_fundamentals.py scripts/update_a_share.py
      - name: Refresh SEC company index and ticker-to-CIK mappings
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python scripts/update_symbols.py || echo "::warning::SEC ticker directory refresh unavailable; existing mapping kept"
      - name: Refresh S&P 500 and Nasdaq history
        run: |
          python scripts/update_data.py || echo "::warning::Index history update unavailable; old dated data preserved"
      - name: Refresh US stock close and SEC financials
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python scripts/update_fundamentals.py --mode full || echo "::warning::US fundamentals update unavailable; old dated data preserved"
      - name: Refresh A-share names and latest obtainable quotes
        run: |
          python scripts/update_a_share.py || echo "::warning::A-share price update unavailable; old dated data preserved"
      - name: Publish all three refreshed caches together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add symbols.json data.json fundamentals.json a_share_data.json
          if git diff --cached --quiet; then
            echo "No changes in latest publicly obtainable data"
            exit 0
          fi
          git commit -m "chore: manually refresh US indices, US stocks and A shares"
          for n in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Published all updated data snapshots"
              exit 0
            fi
            git rebase --abort || true
            sleep 3
          done
          echo "::error::Cannot push data after retries"
          exit 1
